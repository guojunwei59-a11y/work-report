<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>工作汇报省钱小工具</title>
<meta property="og:title" content="工作汇报省钱小工具">
<meta name="description" content="本地生成工作汇报，支持多图片纵向拼接、预览和保存。">
<meta property="og:description" content="本地生成工作汇报，支持多图片纵向拼接、预览和保存。">
<style>
  :root{
    --red:#B01F24;
    --blue:#1B5FA8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#f2f3f5;
    padding:12px 12px 40px;
    max-width:560px;
    margin:0 auto;
  }
  h1{
    font-size:18px;text-align:center;color:var(--red);
    padding:10px 0 14px;letter-spacing:2px;
  }
  .card{
    background:#fff;border-radius:12px;padding:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:12px;
  }
  label{display:block;font-size:13px;color:#666;margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text],textarea{
    width:100%;border:1px solid #ddd;border-radius:8px;
    padding:9px 10px;font-size:15px;outline:none;
    font-family:inherit;
  }
  input:focus,textarea:focus{border-color:var(--red);}
  textarea{min-height:90px;resize:vertical;}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;min-width:0;}
  input::placeholder,textarea::placeholder{color:#999;opacity:1;}
  .btn:disabled{opacity:.6;cursor:wait;}
  #segments img{display:block;width:100%;margin-top:10px;}
  #status{color:var(--red);overflow-wrap:anywhere;}
  .btn{
    display:block;width:100%;border:none;border-radius:10px;
    padding:13px;font-size:16px;font-weight:bold;color:#fff;
    background:var(--red);margin-top:12px;cursor:pointer;
  }
  .btn.gray{background:#888;}
  .btn:active{opacity:.85;}
  .photo-pick{
    border:2px dashed #ccc;border-radius:10px;text-align:center;
    padding:18px 10px;color:#888;font-size:14px;cursor:pointer;
  }
  .photo-pick.has{border-color:var(--red);color:var(--red);}
  #fileInput{display:none;}
  .pos-toggle{display:flex;gap:8px;margin-top:10px;}
  .pos-toggle button{
    flex:1;padding:8px;border:1px solid #ddd;border-radius:8px;
    background:#fff;font-size:14px;cursor:pointer;
  }
  .pos-toggle button.on{background:var(--red);color:#fff;border-color:var(--red);}
  #preview{width:100%;display:block;border:1px solid #e5e5e5;border-radius:8px;}
  #result{width:100%;display:none;border:1px solid #e5e5e5;border-radius:8px;}
  .tip{font-size:12px;color:#999;text-align:center;margin-top:8px;}
</style>
</head>
<body>
<h1>工作汇报省钱小工具</h1>

<div class="card">
  <div class="row2">
    <div>
      <label>标题</label>
      <input type="text" id="inTitle" placeholder="工作汇报" autocomplete="off">
    </div>
    <div>
      <label>副标题</label>
      <input type="text" id="inSub" placeholder="此处填写副标题" autocomplete="off">
    </div>
  </div>
  <div class="row2">
    <div>
      <label>汇报人</label>
      <input type="text" id="inName" placeholder="此处填写个人姓名" autocomplete="off">
    </div>
    <div>
      <label>日期</label>
      <input type="text" id="inDate">
    </div>
  </div>
  <label>汇报单位</label>
  <input type="text" id="inUnit" placeholder="花都经开万洋科技城二期" autocomplete="off">
  <label>备注</label>
  <textarea id="inNote" placeholder="值班保安人员，严格遵守门卫制度，监督施工作业人员，进入施工现场，一人一门禁，正确佩戴安全帽，杜绝代打门禁，测量体温，进入施工现场，并提示注意安全!"></textarea>
</div>

<div class="card">
  <div class="photo-pick" id="pickBox" onclick="document.getElementById('fileInput').click()">
    点击选择照片（可多选，按选择顺序逐张向下拼接）
  </div>
  <input type="file" id="fileInput" accept="image/*" multiple>
  <div class="pos-toggle">
    <button id="posTop" class="on">模板在上</button>
    <button id="posBottom">模板在下</button>
  </div>
  <button class="btn" id="btnGen">生成拼接图</button>
  <div class="tip" id="status" role="status" aria-live="polite"></div>
</div>

<div class="card">
  <label>模板实时预览</label>
  <canvas id="preview"></canvas>
  <img id="result" alt="生成结果">
  <div id="segments"></div>
  <button class="btn gray" id="btnSave" style="display:none">保存图片</button>
  <div class="tip" id="saveTip" style="display:none">如果没有自动下载，长按上方图片选择"保存图片"</div>
</div>

<script>
/* ================= 模板矢量绘制（设计宽度 1280） ================= */
const TW = 1280;                 // 模板设计宽度
const RED = "#B01F24";
const BLUE = "#1B5FA8";
const SERIF = '"SimSun","STSong","Songti SC","Noto Serif SC",serif';

// 在 ctx 上绘制完整模板，返回模板总高度（设计坐标系）
function drawTemplate(ctx, data){
  const M = 56;                  // 边框左右外边距
  const FL = M, FR = TW - M;     // 边框左右
  const FT = 256;                // 边框顶部 y

  // ---------- Logo（矢量重绘，左上角） ----------
  drawLogo(ctx, 62, 28);

  // ---------- 先计算备注换行，得出边框总高 ----------
  ctx.font = "bold 40px " + SERIF;
  const notePad = 26;
  const noteLines = wrapText(ctx, "备注: " + data.note, FR - FL - notePad*2);
  const lineH = 58;

  const yTitle   = FT + 110;          // 标题基线
  const ySub     = FT + 192;          // 副标题基线
  const yDbl     = FT + 240;          // 双线
  const yRow1    = yDbl + 64;         // 汇报人/日期 基线
  const yLine1   = yDbl + 96;
  const yRow2    = yLine1 + 62;       // 汇报单位 基线
  const yLine2   = yLine1 + 94;
  const yNote0   = yLine2 + 60;       // 备注首行基线
  const FB = yNote0 + (noteLines.length - 1) * lineH + 36;  // 边框底部

  // ---------- 装饰边框 ----------
  drawOrnateFrame(ctx, FL, FT, FR - FL, FB - FT);

  // ---------- 标题 / 副标题 ----------
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = RED;
  ctx.font = "bold 78px " + SERIF;
  ctx.strokeStyle = RED;
  ctx.lineWidth = 3.5;
  ctx.lineJoin = "round";
  ctx.strokeText(data.title, TW/2, yTitle);   // 描边加粗
  ctx.fillText(data.title, TW/2, yTitle);
  ctx.fillStyle = "#111";
  ctx.font = "bold 46px " + SERIF;
  ctx.fillText(data.sub, TW/2, ySub);

  // ---------- 双横线 ----------
  ctx.strokeStyle = RED;
  ctx.lineWidth = 5;
  line(ctx, FL, yDbl, FR, yDbl);
  ctx.lineWidth = 2.5;
  line(ctx, FL, yDbl + 11, FR, yDbl + 11);

  // ---------- 行1：汇报人 + 日期 ----------
  ctx.fillStyle = "#111";
  ctx.font = "bold 42px " + SERIF;
  ctx.textAlign = "left";
  if (data.name) ctx.fillText("汇报人: " + data.name, FL + notePad, yRow1);
  ctx.textAlign = "right";
  ctx.fillText("日期: " + data.date, FR - notePad, yRow1);
  ctx.strokeStyle = RED; ctx.lineWidth = 2.5;
  line(ctx, FL, yLine1, FR, yLine1);

  // ---------- 行2：汇报单位 ----------
  ctx.textAlign = "left";
  if (data.unit) ctx.fillText("汇报单位: " + data.unit, FL + notePad, yRow2);
  line(ctx, FL, yLine2, FR, yLine2);

  // ---------- 备注 ----------
  ctx.font = "bold 40px " + SERIF;
  noteLines.forEach((ln, i) => {
    ctx.fillText(ln, FL + notePad, yNote0 + i * lineH);
  });

  return FB + 46;   // 模板总高（边框下留白）
}

function line(ctx, x1, y1, x2, y2){
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}

// 中文按字符换行（备注）
function wrapText(ctx, text, maxW){
  const lines = [];
  let cur = "";
  for (const ch of text){
    if (ch === "\n"){ lines.push(cur); cur = ""; continue; }
    if (ctx.measureText(cur + ch).width > maxW && cur){
      lines.push(cur); cur = ch;
    } else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines.length ? lines : [""];
}

/* ---------- 证书风格装饰边框 ---------- */
function drawOrnateFrame(ctx, x, y, w, h){
  // 外框：顶部两角为内凹圆弧肩，底部直角
  const a = 56;    // 弧肩尺寸
  ctx.strokeStyle = RED;
  ctx.lineWidth = 7;
  ctx.lineJoin = "miter";
  ctx.beginPath();
  ctx.moveTo(x + a, y);
  ctx.lineTo(x + w - a, y);                          // 顶边
  ctx.arc(x + w, y, a, Math.PI, Math.PI/2, true);    // 右上凹弧肩
  ctx.lineTo(x + w, y + h);                          // 右边
  ctx.lineTo(x, y + h);                              // 底边
  ctx.lineTo(x, y + a);                              // 左边
  ctx.arc(x, y, a, Math.PI/2, 0, true);              // 左上凹弧肩
  ctx.closePath();
  ctx.stroke();
}

function drawLogo(ctx, x, y){
  if (!LOGO.complete || !LOGO.naturalWidth) return;
  ctx.save();
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  // 原图切片：图标 0-85，文字 94-319（高 55）
  const cx = x + 100;                    // 竖排块中心线
  const mh = 96, mw = 85/55 * mh;        // 图标
  ctx.drawImage(LOGO, 0, 0, 85, 55, cx - mw/2, y + 8, mw, mh);
  const tw = 204, th = 55/225 * tw;      // 文字
  ctx.drawImage(LOGO, 94, 0, 225, 55, cx - tw/2, y + 8 + mh + 12, tw, th);
  ctx.restore();
}

function getData(){
  return {
    title: $("inTitle").value.trim() || "工 作 汇 报",
    sub:   $("inSub").value.trim(),
    name:  $("inName").value.trim(),
    date:  $("inDate").value.trim(),
    unit:  $("inUnit").value.trim() || DEFAULT_UNIT,
    note:  $("inNote").value.trim() || DEFAULT_NOTE,

}

// 实时预览（仅模板）
function renderPreview(){
  const cv = $("preview");
  const data = getData();
  // 先量高度
  const tmp = document.createElement("canvas");
  tmp.width = TW; tmp.height = 1;
  const tctx = tmp.getContext("2d");

  const th = drawTemplate(tctx, data);

  if (th > MAX_HEIGHT) { $("status").textContent = "备注过长，模板预览及导出超过安全尺寸，请缩短备注。"; return; }
  cv.width = TW; cv.height = th;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,TW,th);
  drawTemplate(ctx, data);
}
["inTitle","inSub","inName","inDate","inUnit","inNote"].forEach(id=>{
  $(id).addEventListener("input", renderPreview);
});

function clearOutput(){
  $("result").removeAttribute("src");
  $("result").style.display = "none";
  $("segments").replaceChildren();
  outputUrls.forEach(url => URL.revokeObjectURL(url));
  outputUrls = [];
  $("btnSave").style.display = $("saveTip").style.display = "none";
  $("preview").style.display = "block";
}

function loadPhoto(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    const timer = setTimeout(() => finish(new Error("图片加载超时：" + file.name)), 30000);
    function finish(error){
      clearTimeout(timer);
      img.onload = img.onerror = null;
      URL.revokeObjectURL(url);
      if (error) { img.src = ""; reject(error); }
      else resolve(img);
    }
    img.onload = () => img.naturalWidth && img.naturalHeight ? finish() : finish(new Error("图片尺寸无效：" + file.name));
    img.onerror = () => finish(new Error("无法读取图片：" + file.name + "，请换用 JPG、PNG 或 WebP。"));
    img.src = url;
  });
}

// FileList 的顺序就是浏览器提供的选择顺序；重新选择完全替换。
$("fileInput").addEventListener("change", async e => {
  const files = [...e.target.files];
  e.target.value = ""; // 允许再次选择同一批文件
  if (!files.length) return;
  const version = ++selectionVersion;
  photos = [];
  clearOutput();
  $("btnGen").disabled = true;
  $("pickBox").classList.remove("has");
  $("pickBox").textContent = "正在读取 " + files.length + " 张图片…";
  $("status").textContent = "";
  const selected = [];
  try {
    for (const file of files){
      if (version !== selectionVersion) return;
      const img = await loadPhoto(file);
      selected.push({file, width: img.naturalWidth, height: img.naturalHeight});
      img.src = "";
    }
    if (version !== selectionVersion) return;
    photos = selected;
    $("pickBox").textContent = "已选 " + photos.length + " 张照片，点击可重新选择";
    $("pickBox").classList.add("has");
  } catch(error){
    if (version !== selectionVersion) return;
    $("pickBox").textContent = "选择失败，点击重新选择图片";
    $("status").textContent = error.message;
  } finally {
    if (version === selectionVersion) $("btnGen").disabled = false;
  }
});

$("posTop").onclick = () => { templateOnTop = true; $("posTop").classList.add("on"); $("posBottom").classList.remove("on"); };
$("posBottom").onclick = () => { templateOnTop = false; $("posBottom").classList.add("on"); $("posTop").classList.remove("on"); };

function encodeCanvas(cv){
  return new Promise((resolve, reject) => {
    cv.toBlob(blob => blob && blob.size ? resolve(blob) : reject(new Error("浏览器无法导出图片，请减少图片数量或尺寸后重试。")), "image/jpeg", .92);
  });
}
function download(url, name){
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}

// 所有图片逐张纵向排列，不根据宽高比例将两张图片并排。
function photoRows(selected, width){
  return selected.map(photo => {
    const height = width * photo.height / photo.width;
    return {height, cells:[{photo, x:0, width, height}]};
  });
}

function reportBlocks(selected, width, templateH, top){
  const rows = photoRows(selected,width);
  const tplHeight = templateH * width / TW;
  if (!rows.length) return [{height:tplHeight, template:true, templateY:0, cells:[]}];
  const index = top ? 0 : rows.length - 1;
  const block = rows[index];
  block.template = true;
  block.templateY = top ? 0 : block.height;
  block.photoY = top ? tplHeight : 0;
  block.height += tplHeight; // 模板与相邻完整照片行绑定，不生成孤立模板尾段。
  return rows;
}

function splitBlocks(blocks, limit){
  const pack = capacity => {
    const groups = []; let group = [], height = 0;
    for (const block of blocks){
      if (group.length && Math.ceil(height + block.height) > capacity){
        groups.push(group); group = []; height = 0;
      }
      group.push(block); height += block.height;
    }
    if (group.length) groups.push(group);
    return groups;
  };
  const count = pack(limit).length;
  // 在最少段数下缩小各段最大高度，让剩余行重新分配，避免过短尾段。
  let low = Math.ceil(Math.max(...blocks.map(b => b.height)));
  let high = limit;
  while (low < high){
    const middle = Math.floor((low + high) / 2);
    if (pack(middle).length <= count) high = middle;
    else low = middle + 1;
  }
  return pack(low);
}

$("btnGen").onclick = async () => {
  if (busy) return;
  busy = true;
  $("btnGen").disabled = true;
  $("fileInput").disabled = true;
  clearOutput();
  const data = getData();
  const selected = [...photos];
  const top = templateOnTop;
  let cv;
  try {
    await document.fonts.ready;
    if (!LOGO.complete) await LOGO.decode();
    // 只使用 Canvas 像素坐标；CSS 尺寸与 DPR 不参与拼图尺寸计算。
    const preferredWidth = selected.length ? Math.min(TW, Math.max(900, ...selected.map(p => p.width))) : TW;
    const measure = document.createElement("canvas");
    measure.width = TW; measure.height = 1;
    const templateH = drawTemplate(measure.getContext("2d"), data);
    measure.width = measure.height = 1;
    if (templateH > MAX_HEIGHT) throw new Error("备注过长，模板超过安全尺寸，请缩短备注后重试。");
    let urls;
    // 先尝试较大的移动端画布预算，实际读写和编码失败后再按完整行降级。
    for (const budget of [1, .5, .25, .125]){
      const maxHeight = Math.floor(MAX_HEIGHT * budget);
      const maxPixels = Math.floor(MAX_PIXELS * budget);
      const largest = Math.max(...reportBlocks(selected,preferredWidth,templateH,top).map(b => b.height));
      // 超长的单张照片不能按像素切开；统一等比例缩小整个报告宽度使完整行可容纳。
      const W = Math.floor(preferredWidth * Math.min(1, maxHeight / largest, Math.sqrt(maxPixels / (preferredWidth * largest))));
      if (!Number.isFinite(W) || W < 320) throw new Error("单张长截图过长，完整导出会过于模糊，请选择较短的截图后重试。");
      const scale = W / TW;
      const blocks = reportBlocks(selected,W,templateH,top);
      const limit = Math.min(maxHeight,Math.floor(maxPixels / W));
      const groups = splitBlocks(blocks,limit);
      const count = groups.length;
      if (count > MAX_PARTS) throw new Error("图片总长度过大（最多 100 段），请减少图片数量后分批生成。");
      const pending = [];
      try {
        for (let i = 0; i < count; i++){
          $("status").textContent = count > 1 ? "长图分段生成中：" + (i+1) + "/" + count : "正在生成图片…";
          await new Promise(resolve => setTimeout(resolve, 0));
          const height = Math.ceil(groups[i].reduce((sum,b) => sum + b.height,0));
          cv = document.createElement("canvas"); cv.width = W; cv.height = height;
          const ctx = cv.getContext("2d");
          if (!ctx) throw new Error("无法创建画布");
          ctx.fillStyle = "#fff"; ctx.fillRect(0,0,W,height);
          // 检查画布末端可读写，不能只相信设置的宽高。
          if (ctx.getImageData(W-1,height-1,1,1).data[3] !== 255) throw new Error("画布超出浏览器能力");
          let y = 0;
          for (const block of groups[i]){
            if (block.template){
              ctx.save(); ctx.translate(0,y + block.templateY); ctx.scale(scale,scale);
              drawTemplate(ctx,data); ctx.restore();
            }
            for (const cell of block.cells){
              const img = await loadPhoto(cell.photo.file);
              try { ctx.drawImage(img,cell.x,y + (block.photoY || 0),cell.width,cell.height); }
              finally { img.src = ""; }
            }
            y += block.height;
          }
          const blob = await encodeCanvas(cv);
          // 确认编码后的尺寸，防止空白或静默截断。
          const url = URL.createObjectURL(blob);
          pending.push(url);
          const check = new Image(); check.src = url; await check.decode();
          if (check.naturalWidth !== W || check.naturalHeight !== height) throw new Error("导出尺寸不完整");
          check.src = "";
          cv.width = cv.height = 1;
        }
        urls = pending;
        break;
      } catch(error){
        pending.forEach(url => URL.revokeObjectURL(url));
        if (cv) cv.width = cv.height = 1;
        if (budget === .125 || /无法读取|加载超时|尺寸无效/.test(error.message)) throw error;
      }
    }
    outputUrls = urls;
    const base = "工作汇报_" + data.date.replace(/[\\/:*?"<>|.]/g, "");
    $("preview").style.display = "none";
    if (urls.length === 1){
      $("result").src = urls[0]; $("result").style.display = "block";
      $("btnSave").style.display = "block";
      $("btnSave").onclick = () => download(urls[0],base+".jpg");
    } else {
      urls.forEach((url,i) => {
        const img = document.createElement("img"); img.src = url; img.alt = "生成结果第 " + (i+1) + " 段";
        const btn = document.createElement("button"); btn.className = "btn gray";
        btn.textContent = "保存第 " + (i+1) + "/" + urls.length + " 段";
        btn.onclick = () => download(url,base+"_"+String(i+1).padStart(3,"0")+".jpg");
        $("segments").append(img,btn);
      });
    }
    $("saveTip").style.display = "block";
    $("status").textContent = urls.length > 1 ? "长图超过单张安全尺寸，已完整分为 " + urls.length + " 段，请按顺序逐段保存。" : "生成完成，图片仅在本地处理。";
  } catch(error){
    clearOutput();
    $("status").textContent = "生成失败：" + error.message + " 请减少图片数量或尺寸后重试。";
  } finally {
    if (cv) cv.width = cv.height = 1;
    busy = false;
    $("btnGen").disabled = false;
    $("fileInput").disabled = false;
  }
};

renderPreview();
</script>
</body>
</html>
